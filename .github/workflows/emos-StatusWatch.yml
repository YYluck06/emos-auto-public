name: emos-StatusWatch

# 每天推一次账号快照：萝卜/境界/观影资格/邀请名额/卡槽，
# 并在「萝卜够 800（E 魔盒邀请套餐）/ 3000（官方邀请）/ 100（固定密码）」时给出提醒。
on:
  schedule:
    - cron: '0 13 * * *' # UTC 13:00 = 北京时间 21:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emos-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 取出私有核心库 → app/
        uses: actions/checkout@v4
        with:
          repository: YYluck06/emos-auto-core
          token: ${{ secrets.CORE_PAT }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备代理出口（可选；支持机场任意协议，自动装 sing-box）
        env:
          EMOS_PROXY: ${{ secrets.EMOS_PROXY || vars.EMOS_PROXY }}
          PROXY_OPTIONAL: ${{ vars.PROXY_OPTIONAL || '0' }}
        run: bash app/scripts/setup-proxy.sh

      - name: 采集快照
        env:
          EMOS_TOKEN: ${{ secrets.EMOS_TOKEN }}
          EMOS_PROXY: ${{ secrets.EMOS_PROXY || vars.EMOS_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_PROXY: ${{ secrets.TG_PROXY || '' }}
        run: |
          if ! node app/scripts/status.mjs > emos/status.json 2>> "$GITHUB_STEP_SUMMARY"; then
            echo '### 采集失败，原样输出：' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat emos/status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat emos/status.json
            exit 1
          fi

      - name: 回写公开库
        run: |
          git config user.name  "emos-bot"
          git config user.email "emos-bot@users.noreply.github.com"
          git add emos/status.json
          if git diff --cached --quiet; then echo "无变化"; else
            git commit -m "chore(status): $(date -u +%FT%TZ)"
            git push
          fi
